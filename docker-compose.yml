services:
  backend:
    build:
      context: .
      dockerfile: apps/qanunai_backend/Dockerfile
    env_file:
      - apps/qanunai_backend/.env
    environment:
      # Container-network overrides (environment: beats env_file:).
      RAG_BACKEND: pgvector
      PG_CONN_STR: postgresql://postgres:postgres@postgres:5432/postgres
      # Remove this override if you switch to a hosted embedding provider.
      EMBEDDING_BASE_URL: http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      # When RAG_BACKEND=qdrant, also wait on qdrant and set:
      # QDRANT_URL=http://qdrant:6333
    networks:
      - qanunai

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qanunai

  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["qdrant"]  # start with: docker compose --profile qdrant up
    ports:
      - "6333:6333"
      # - "6334:6334" the gRPC interface for high-performance client connections
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qanunai

networks:
  qanunai:

volumes:
  postgres_data:
  qdrant_storage:
