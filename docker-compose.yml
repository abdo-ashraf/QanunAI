services:
  backend:
    build:
      context: .
      dockerfile: apps/qanunai_backend/Dockerfile
    env_file:
      - apps/qanunai_backend/.env
    environment:
      # Container-network overrides (environment: beats env_file:).
      QDRANT_URL: http://qdrant:6333
      # Remove this override if you switch to a hosted embedding provider.
      EMBEDDING_BASE_URL: http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - qanunai

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      # - "6334:6334" the gRPC interface for high-performance client connections
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qanunai

networks:
  qanunai:

volumes:
  qdrant_storage:
