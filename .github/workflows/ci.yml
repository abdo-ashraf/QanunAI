name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/qanunai_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Sync dependencies
        run: python -m uv sync --frozen
      - name: Ruff lint
        run: python -m uv run ruff check .
      - name: Ruff format check
        run: python -m uv run ruff format --check .
      - name: Validate backend imports
        run: python -m uv run python -c "from presentation.app import app; print(app.title)"
