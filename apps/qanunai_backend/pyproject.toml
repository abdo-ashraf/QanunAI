[project]
name = "qanunai-backend"
version = "0.1.0"
description = "QanunAI backend service"
readme = "README.md"
authors = [
    { name = "copilot-swe-agent[bot]", email = "198982749+Copilot@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "haystack-ai>=3.3.0",
    "langfuse-haystack>=3.3.0",
    "markdown-it-py>=4.2.0",
    "mdit-plain>=1.0.1",
    "pgvector-haystack>=7.0.0",
    "prometheus-client>=0.22.0,<1.0",
    "pydantic-settings>=2.11.0",
    "pypdf>=6.20.0",
    "qdrant-haystack>=11.1.0",
    "pyyaml>=6.0.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "dvc>=3.67.1",
    "pre-commit>=4.6.2",
    "ruff>=0.14.0,<0.15.0",
]

[project.scripts]
qanunai-backend = "main:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["application", "domain", "infrastructure", "presentation"]
module-root = "src"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
