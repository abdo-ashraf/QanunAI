global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: rag-api
    metrics_path: /metrics/
    static_configs:
      - targets:
          - backend:8000
        labels:
          service: rag-api
          environment: local

  - job_name: langfuse
    metrics_path: /metrics
    static_configs:
      - targets:
          - langfuse-exporter:9800
